            }
          }
          EOF

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Luu file jar
        uses: actions/upload-artifact@v4
        with:
          name: AntiChunkBan-1.21.11-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
