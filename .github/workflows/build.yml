            "name": "AntiChunkBan",
            "description": "Client-side defense against chunk bans: block entity floods, oversized NBT, XP bottle floods and corrupted packets.",
            "authors": ["Operator"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
